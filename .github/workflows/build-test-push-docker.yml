name: Modify Docker image

on:
  push:
    branches:
    - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        name: Check out code
    
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build locally
      - name: Build image
        run: |
          docker build --platform=linux/amd64 \
            -t leaveyou/ros1-noetic:test .

      # Run tests / smoke test
      - name: Smoke test image
        run: |
          docker run --rm \
            leaveyou/ros1-noetic:test \
            bash -lc "source /opt/ros/noetic/setup.bash && rosversion -d"

      # Only push if build + tests pass
      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag leaveyou/ros1-noetic:test leaveyou/ros1-noetic:latest
          docker tag leaveyou/ros1-noetic:test leaveyou/ros1-noetic:${{ github.sha }}
          docker push leaveyou/ros1-noetic:latest
          docker push leaveyou/ros1-noetic:${{ github.sha }}
