name: Modify Docker image

on:
  push:
    branches:
    - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        name: Check out code
    
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build locally
      - name: Build image
        run: |
          docker build --platform=linux/amd64 \
            -t leaveyou/ros1-noetic:test .

      # test
      - name: Smoke test image (headless, timed)
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            leaveyou/ros1-noetic:test\
            -lc "source /opt/ros/noetic/setup.bash && \
                 source /ros1_ws/devel/setup.bash && \
                 timeout 30s roslaunch projet challenge.launch gui:=false --screen"
                 
      # Push
      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag leaveyou/ros1-noetic:test leaveyou/ros1-noetic:latest
          docker tag leaveyou/ros1-noetic:test leaveyou/ros1-noetic:${{ github.sha }}
          docker push leaveyou/ros1-noetic:latest
          docker push leaveyou/ros1-noetic:${{ github.sha }}
